<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Abhishek Mukherjee — Engineer, Builder, Systems Thinker">

  <!-- Background -->
  <rect width="1200" height="300" rx="3" fill="#070709"/>

  <!-- Left editorial margin rule -->
  <line x1="64" y1="36" x2="64" y2="264" stroke="#1C1C22" stroke-width="1"/>

  <!-- Margin index label -->
  <text x="32" y="160"
    font-family="'Courier New',Courier,monospace"
    font-size="10" fill="#252530" text-anchor="middle"
    letter-spacing="2">01</text>

  <!-- ── Name Block ── -->

  <!-- ABHISHEK — primary, full opacity -->
  <text x="88" y="152"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="80" font-weight="300"
    letter-spacing="14"
    fill="#EBEBED">ABHISHEK</text>

  <!-- MUKHERJEE — secondary, reduced opacity for depth -->
  <text x="88" y="228"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="80" font-weight="300"
    letter-spacing="14"
    fill="#EBEBED" opacity="0.24">MUKHERJEE</text>

  <!-- Rule beneath name -->
  <line x1="64" y1="248" x2="760" y2="248" stroke="#1C1C22" stroke-width="1"/>

  <!-- Tagline -->
  <text x="88" y="270"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="11" font-weight="400"
    letter-spacing="3.5"
    fill="#5E5E66">ENGINEER · BUILDER · SYSTEMS THINKER</text>

  <!-- ── Geometric Crosshair Mark (right zone) ── -->

  <!-- Outer circle — thin structural ring -->
  <circle cx="1040" cy="150" r="82"
    fill="none" stroke="#1C1C22" stroke-width="1"/>

  <!-- Inner circle — inner ring -->
  <circle cx="1040" cy="150" r="50"
    fill="none" stroke="#1C1C22" stroke-width="0.5" opacity="0.5"/>

  <!-- Crosshair lines (inner segment only) -->
  <line x1="1040" y1="118" x2="1040" y2="182" stroke="#252530" stroke-width="1"/>
  <line x1="1008" y1="150" x2="1072" y2="150" stroke="#252530" stroke-width="1"/>

  <!-- Cardinal tick marks -->
  <line x1="1040" y1="62" x2="1040" y2="76" stroke="#252530" stroke-width="1.5"/>
  <line x1="1040" y1="224" x2="1040" y2="238" stroke="#252530" stroke-width="1.5"/>
  <line x1="952" y1="150" x2="966" y2="150" stroke="#252530" stroke-width="1.5"/>
  <line x1="1114" y1="150" x2="1128" y2="150" stroke="#252530" stroke-width="1.5"/>

  <!-- Center dot — accent -->
  <circle cx="1040" cy="150" r="3.5" fill="#8B7CF8"/>

  <!-- Rotating outer arc — clockwise, slow -->
  <circle cx="1040" cy="150" r="82"
    fill="none"
    stroke="#8B7CF8"
    stroke-width="1.5"
    stroke-dasharray="52 463"
    stroke-linecap="round"
    opacity="0.65">
    <animateTransform attributeName="transform" type="rotate"
      from="0 1040 150" to="360 1040 150"
      dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Rotating inner arc — counter-clockwise, slower -->
  <circle cx="1040" cy="150" r="50"
    fill="none"
    stroke="#8B7CF8"
    stroke-width="1"
    stroke-dasharray="22 292"
    stroke-linecap="round"
    opacity="0.3">
    <animateTransform attributeName="transform" type="rotate"
      from="0 1040 150" to="-360 1040 150"
      dur="28s" repeatCount="indefinite"/>
  </circle>

  <!-- Handle label below mark -->
  <text x="1040" y="282"
    font-family="'Courier New',Courier,monospace"
    font-size="9" fill="#2E2E36" text-anchor="middle"
    letter-spacing="2.5">RICK2882004</text>

  <!-- Outer border -->
  <rect x="0.5" y="0.5" width="1199" height="299" rx="3"
    fill="none" stroke="#1C1C22" stroke-width="1"/>

</svg>
