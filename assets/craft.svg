<svg viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Stack: TypeScript, Python · React, Next.js, Node.js · Postgres, Docker, Supabase, Git">

  <!-- Background -->
  <rect width="900" height="160" rx="2" fill="#0F0F12"/>

  <!-- ── Column 1: LANGUAGE ── -->
  <text x="48" y="44"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="9" font-weight="600" letter-spacing="3.5"
    fill="#5E5E66">LANGUAGE</text>
  <line x1="48" y1="56" x2="238" y2="56" stroke="#1C1C22" stroke-width="1"/>
  <text x="48" y="90"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="17" font-weight="300" fill="#EBEBED">TypeScript</text>
  <text x="48" y="120"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="17" font-weight="300" fill="#9696A0">Python</text>

  <!-- Vertical divider 1 -->
  <line x1="270" y1="32" x2="270" y2="130" stroke="#1C1C22" stroke-width="1"/>

  <!-- ── Column 2: RUNTIME ── -->
  <text x="308" y="44"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="9" font-weight="600" letter-spacing="3.5"
    fill="#5E5E66">RUNTIME</text>
  <line x1="308" y1="56" x2="550" y2="56" stroke="#1C1C22" stroke-width="1"/>
  <text x="308" y="90"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="17" font-weight="300" fill="#EBEBED">React · Next.js</text>
  <text x="308" y="120"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="17" font-weight="300" fill="#9696A0">Node.js</text>

  <!-- Vertical divider 2 -->
  <line x1="580" y1="32" x2="580" y2="130" stroke="#1C1C22" stroke-width="1"/>

  <!-- ── Column 3: INFRASTRUCTURE ── -->
  <text x="616" y="44"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="9" font-weight="600" letter-spacing="3.5"
    fill="#5E5E66">INFRASTRUCTURE</text>
  <line x1="616" y1="56" x2="855" y2="56" stroke="#1C1C22" stroke-width="1"/>
  <text x="616" y="90"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="17" font-weight="300" fill="#EBEBED">Postgres · Docker</text>
  <text x="616" y="120"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="17" font-weight="300" fill="#9696A0">Supabase · Git</text>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="899" height="159" rx="2"
    fill="none" stroke="#1C1C22" stroke-width="1"/>

</svg>
