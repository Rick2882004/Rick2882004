<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech stack">
  <defs>
    <linearGradient id="grid-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E8FFF"/><stop offset="100%" stop-color="#A66CFF"/>
    </linearGradient>
    <style>
      .lbl { font-family: 'SF Mono','JetBrains Mono',ui-monospace,monospace; font-size: 15px; fill: #C7C9D9; }
      .tile { fill: #13141C; stroke: #22242F; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="260" fill="#0A0B10"/>

  <!-- row 1 -->
  <g transform="translate(20,20)">
    <rect class="tile" width="270" height="100" rx="16"/>
    <g transform="translate(20,20) scale(0.9)">
      <path d="M20 24 H36" stroke="url(#grid-g)" stroke-width="3" stroke-linecap="round"/>
      <path d="M28 24 V42" stroke="url(#grid-g)" stroke-width="3" stroke-linecap="round"/>
      <rect x="36" y="34" width="8" height="8" rx="2" fill="url(#grid-g)"/>
    </g>
    <text x="90" y="58" class="lbl">TypeScript</text>
  </g>

  <g transform="translate(310,20)">
    <rect class="tile" width="270" height="100" rx="16"/>
    <g transform="translate(20,20) scale(0.9)">
      <path d="M24 20 C18 20 18 26 18 26 C18 26 18 32 24 32 L34 32" fill="none" stroke="url(#grid-g)" stroke-width="3" stroke-linecap="round"/>
      <path d="M40 44 C46 44 46 38 46 38 C46 38 46 32 40 32 L30 32" fill="none" stroke="url(#grid-g)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="24" cy="24" r="1.6" fill="#EDEEF3"/>
      <circle cx="40" cy="40" r="1.6" fill="#EDEEF3"/>
    </g>
    <text x="90" y="58" class="lbl">Python</text>
  </g>

  <g transform="translate(600,20)">
    <rect class="tile" width="270" height="100" rx="16"/>
    <g transform="translate(20,20) scale(0.9)">
      <g stroke="url(#grid-g)" stroke-width="2" fill="none">
        <ellipse cx="32" cy="32" rx="16" ry="6.5"/>
        <ellipse cx="32" cy="32" rx="16" ry="6.5" transform="rotate(60 32 32)"/>
        <ellipse cx="32" cy="32" rx="16" ry="6.5" transform="rotate(120 32 32)"/>
      </g>
      <circle cx="32" cy="32" r="3.5" fill="#EDEEF3"/>
    </g>
    <text x="90" y="58" class="lbl">React / Next.js</text>
  </g>

  <g transform="translate(890,20)">
    <rect class="tile" width="270" height="100" rx="16"/>
    <g transform="translate(20,20) scale(0.9)">
      <path d="M32 18 L45 25 V39 L32 46 L19 39 V25 Z" fill="none" stroke="url(#grid-g)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M25 32 H39 M32 25 V39" stroke="#EDEEF3" stroke-width="1.5" opacity="0.6"/>
    </g>
    <text x="90" y="58" class="lbl">Node.js</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(20,140)">
    <rect class="tile" width="270" height="100" rx="16"/>
    <g transform="translate(20,20) scale(0.9)">
      <path d="M32 18 C40 28 46 34 46 41 C46 48.2 39.7 53 32 53 C24.3 53 18 48.2 18 41 C18 34 24 28 32 18 Z" fill="none" stroke="url(#grid-g)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M25 41 H39" stroke="#EDEEF3" stroke-width="1.5" opacity="0.6"/>
    </g>
    <text x="90" y="58" class="lbl">Postgres / Supabase</text>
  </g>

  <g transform="translate(310,140)">
    <rect class="tile" width="270" height="100" rx="16"/>
    <g transform="translate(20,20) scale(0.9)">
      <rect x="18" y="38" width="28" height="7" rx="2" fill="none" stroke="url(#grid-g)" stroke-width="2"/>
      <rect x="21" y="29" width="22" height="7" rx="2" fill="none" stroke="url(#grid-g)" stroke-width="2"/>
      <rect x="24" y="20" width="16" height="7" rx="2" fill="none" stroke="url(#grid-g)" stroke-width="2"/>
    </g>
    <text x="90" y="58" class="lbl">Docker</text>
  </g>

  <g transform="translate(600,140)">
    <rect class="tile" width="270" height="100" rx="16"/>
    <g transform="translate(20,20) scale(0.9)">
      <circle cx="27" cy="27" r="10" fill="none" stroke="url(#grid-g)" stroke-width="2.5"/>
      <rect x="30" y="30" width="16" height="16" rx="3" fill="none" stroke="#EDEEF3" stroke-width="2" opacity="0.7"/>
    </g>
    <text x="90" y="58" class="lbl">Design Systems</text>
  </g>

  <g transform="translate(890,140)">
    <rect class="tile" width="270" height="100" rx="16"/>
    <g transform="translate(20,20) scale(0.9)">
      <path d="M22 18 V34 C22 40 27 40 33 40 H40" fill="none" stroke="url(#grid-g)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M34 34 L40 40 L34 46" fill="none" stroke="url(#grid-g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="22" cy="18" r="3.2" fill="#EDEEF3"/>
    </g>
    <text x="90" y="58" class="lbl">Git</text>
  </g>
</svg>
