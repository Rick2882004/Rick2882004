<svg viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Now: Building conversational OS infrastructure with LLMs. Exploring ambient computing interfaces. Researching edge-native backend architectures.">

  <!-- Background -->
  <rect width="900" height="210" rx="2" fill="#0F0F12"/>

  <!-- Left accent bar — single violet rule -->
  <rect x="0" y="0" width="3" height="210" rx="1" fill="#8B7CF8"/>

  <!-- Label: NOW -->
  <text x="32" y="48"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="10" font-weight="600" letter-spacing="4.5"
    fill="#8B7CF8">NOW</text>

  <!-- Live pulse dot -->
  <circle cx="82" cy="43" r="3.5" fill="#8B7CF8">
    <animate attributeName="opacity" values="1;0.15;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Year — right annotation -->
  <text x="870" y="48" text-anchor="end"
    font-family="'Courier New',Courier,monospace"
    font-size="10" fill="#2E2E36" letter-spacing="1">2025</text>

  <!-- Horizontal rule -->
  <line x1="32" y1="64" x2="870" y2="64" stroke="#1C1C22" stroke-width="1"/>

  <!-- Focus line 1 — primary -->
  <text x="32" y="104"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="16" font-weight="300"
    fill="#EBEBED">Building conversational OS infrastructure with large language models</text>

  <!-- Focus line 2 — secondary -->
  <text x="32" y="138"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="16" font-weight="300"
    fill="#9696A0">Exploring where software becomes ambient and invisible</text>

  <!-- Focus line 3 — tertiary -->
  <text x="32" y="172"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="16" font-weight="300"
    fill="#5E5E66">Researching edge-native architectures for real-time systems</text>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="899" height="209" rx="2"
    fill="none" stroke="#1C1C22" stroke-width="1"/>

</svg>
