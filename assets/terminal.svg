<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="terminal session">
  <defs>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E8FFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A66CFF" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="termClip">
      <rect x="1" y="1" width="898" height="398" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#termClip)">
    <rect x="1" y="1" width="898" height="398" fill="#0D0E14"/>

    <!-- title bar -->
    <rect x="1" y="1" width="898" height="42" fill="#13141C"/>
    <circle cx="28" cy="22" r="6" fill="#4C4E5C"/>
    <circle cx="50" cy="22" r="6" fill="#4C4E5C"/>
    <circle cx="72" cy="22" r="6" fill="#4C4E5C"/>
    <text x="450" y="27" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',ui-monospace,monospace"
          font-size="13" fill="#8C8FA3">abhishek@dev — zsh</text>
    <line x1="1" y1="43" x2="899" y2="43" stroke="#22242F" stroke-width="1"/>

    <!-- rotating command blocks -->
    <g font-family="'SF Mono','JetBrains Mono',ui-monospace,monospace" font-size="17">

      <g opacity="0">
        <animate attributeName="opacity" dur="15s" repeatCount="indefinite" begin="0s"
                  keyTimes="0;0.02;0.18;0.2;1" values="0;1;1;0;0"/>
        <text x="36" y="90"><tspan fill="#A66CFF">➜</tspan><tspan fill="#6E8FFF" dx="8">~</tspan><tspan fill="#EDEEF3" dx="8">whoami</tspan></text>
        <text x="36" y="126" fill="#C7C9D9">abhishek mukherjee</text>
        <text x="36" y="152" fill="#5B5E72">ai engineer · full-stack developer · systems &amp; interfaces</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" dur="15s" repeatCount="indefinite" begin="0s"
                  keyTimes="0;0.2;0.22;0.38;0.4;1" values="0;0;1;1;0;0"/>
        <text x="36" y="90"><tspan fill="#A66CFF">➜</tspan><tspan fill="#6E8FFF" dx="8">~</tspan><tspan fill="#EDEEF3" dx="8">projects</tspan></text>
        <text x="36" y="126" fill="#C7C9D9">jarvis-ai-os</text>
        <text x="36" y="152" fill="#C7C9D9">ridex</text>
        <text x="36" y="178" fill="#C7C9D9">musicflow</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" dur="15s" repeatCount="indefinite" begin="0s"
                  keyTimes="0;0.4;0.42;0.58;0.6;1" values="0;0;1;1;0;0"/>
        <text x="36" y="90"><tspan fill="#A66CFF">➜</tspan><tspan fill="#6E8FFF" dx="8">~</tspan><tspan fill="#EDEEF3" dx="8">stack --list</tspan></text>
        <text x="36" y="126" fill="#C7C9D9">typescript · python · react · node.js</text>
        <text x="36" y="152" fill="#C7C9D9">postgres · docker · supabase</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" dur="15s" repeatCount="indefinite" begin="0s"
                  keyTimes="0;0.6;0.62;0.78;0.8;1" values="0;0;1;1;0;0"/>
        <text x="36" y="90"><tspan fill="#A66CFF">➜</tspan><tspan fill="#6E8FFF" dx="8">~</tspan><tspan fill="#EDEEF3" dx="8">contact</tspan></text>
        <text x="36" y="126" fill="#C7C9D9">reach out through the links below</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" dur="15s" repeatCount="indefinite" begin="0s"
                  keyTimes="0;0.8;0.82;0.96;0.98;1" values="0;0;1;1;0;0"/>
        <text x="36" y="90"><tspan fill="#A66CFF">➜</tspan><tspan fill="#6E8FFF" dx="8">~</tspan><tspan fill="#EDEEF3" dx="8">exit</tspan></text>
        <text x="36" y="126" fill="#5B5E72">session ended — see you around</text>
      </g>
    </g>

    <!-- persistent bottom prompt -->
    <line x1="36" y1="330" x2="864" y2="330" stroke="#22242F" stroke-width="1"/>
    <text x="36" y="365" font-family="'SF Mono','JetBrains Mono',ui-monospace,monospace" font-size="17">
      <tspan fill="#A66CFF">➜</tspan><tspan fill="#6E8FFF" dx="8">~</tspan>
    </text>
    <rect x="86" y="352" width="10" height="18" fill="#EDEEF3">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="898" height="398" rx="14" fill="none" stroke="url(#termBorder)" stroke-width="1.5"/>
</svg>
